<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily CS – Bloqueos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8FF; --surface:#FFFFFF; --ink:#1A1322; --muted:#6B5982; --line:#E6E0FA;
  --brand:#6D16DF; --brand-soft:#F3EDFF; --lime:#CFFF65; --dark:#1A1330;
  --ok:#16A34A; --ok-soft:#DCFCE7; --pend:#E8920B; --pend-soft:#FCEFCF;
  --heat:#6D16DF; --heat-rgb:109,22,223; --bar:#C5BAD4; --focus:#6D16DF;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120B1F; --surface:#1C1330; --ink:#EDE7F7; --muted:#A596C2; --line:#2E2347;
    --brand:#A66BFF; --brand-soft:#241838; --lime:#CFFF65; --dark:#241838;
    --ok:#4FD98A; --ok-soft:#163525; --pend:#F0A93A; --pend-soft:#3A2D16;
    --heat:#A66BFF; --heat-rgb:166,107,255; --bar:#5B4B78; --focus:#A66BFF;
    --danger:#F87171; --danger-soft:#3A1818; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120B1F; --surface:#1C1330; --ink:#EDE7F7; --muted:#A596C2; --line:#2E2347;
  --brand:#A66BFF; --brand-soft:#241838; --lime:#CFFF65; --dark:#241838;
  --ok:#4FD98A; --ok-soft:#163525; --pend:#F0A93A; --pend-soft:#3A2D16;
  --heat:#A66BFF; --heat-rgb:166,107,255; --bar:#5B4B78; --focus:#A66BFF;
  --danger:#F87171; --danger-soft:#3A1818; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-family:var(--cond);font-weight:700;font-size:2.4rem;line-height:1.02;margin:0;letter-spacing:-.02em}
h1 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--brand)}
.sub{color:var(--muted);margin:7px 0 0;font-size:.95rem;max-width:620px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;transition:transform .12s,background .2s}
.btn:hover{background:#5a0fc0}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.small{padding:6px 14px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:default}

.tabs{display:inline-flex;gap:4px;background:var(--brand-soft);border-radius:999px;padding:4px;margin-bottom:24px}
.tab{background:none;border:0;padding:9px 22px;border-radius:999px;cursor:pointer;font-family:var(--cond);font-size:1.1rem;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:baseline;transition:background .2s,color .2s}
.tab[aria-selected="true"]{color:#fff;background:var(--brand)}
.tab .n{font-size:.9rem;font-weight:600;opacity:.8}

/* Scoreboard */
.board{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:18px;margin-bottom:22px}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.score{background:var(--dark);color:#F3EFFA;border-radius:18px;padding:22px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;align-content:start;position:relative;overflow:hidden}
.score::after{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(207,255,101,.18),transparent 70%);pointer-events:none}
.score .big{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.score .big b{font-family:var(--cond);font-size:4.6rem;line-height:.88;font-weight:800;color:var(--lime)}
.score .big span{opacity:.85;font-size:1rem}
.score .k b{display:block;font-family:var(--cond);font-size:2.1rem;font-weight:700;line-height:1}
.score .k span{font-size:.8rem;opacity:.72}
.score .k.pend b{color:#F5B54B}
.score .k.ok b{color:#6FD39F}
.score .k.danger b{color:#FF8080}
.score .delta{grid-column:1/-1;margin-top:14px;font-size:.85rem;opacity:.8;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 1px 3px rgba(26,19,48,.04)}
.panel h2{font-family:var(--cond);font-size:1.3rem;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
.panel .hint{color:var(--muted);font-size:.86rem;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:22px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.full{margin-bottom:22px}
.scroll{overflow-x:auto}
svg{display:block;max-width:100%}
svg text{font-family:var(--sans);fill:var(--ink)}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin:-4px 0 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.clickable{cursor:pointer}

/* Heatmap */
table{border-collapse:collapse;width:100%;font-size:.9rem}
.heat th,.heat td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.heat th{font-weight:600;font-size:.8rem;color:var(--muted);vertical-align:bottom;white-space:normal;min-width:84px;max-width:130px}
.heat th:first-child,.heat td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.heat td.c{font-family:var(--cond);font-size:1.05rem;font-weight:600}
.heat td.z{color:var(--line)}
.heat tr.tot td{font-weight:700;border-bottom:0}
.heat td.rt{font-weight:700}

/* Pending table */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:.85rem;cursor:pointer;transition:background .15s,color .15s}
.chip:hover{background:var(--brand-soft)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.list th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.list td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.list td.cm{color:var(--muted);font-size:.85rem;min-width:260px;max-width:420px}
.list td.p{min-width:200px;font-weight:500}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:.78rem;font-weight:600;white-space:nowrap}
.tag.pend{background:var(--pend-soft);color:var(--pend)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.days{font-family:var(--cond);font-weight:700;font-size:1.05rem}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.toggle{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:40px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:6px;font-family:var(--cond)}

/* Upload panel */
#upload{display:none;background:var(--surface);border:1px solid var(--brand);border-radius:18px;padding:18px 20px;margin-bottom:20px}
#upload.show{display:block}
#upload h3{margin:0 0 4px;font-family:var(--cond);font-size:1.3rem;font-weight:700}
.up-row{display:grid;grid-template-columns:minmax(0,2fr) auto auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:700px){.up-row{grid-template-columns:1fr 1fr}}
.up-row .fn{font-size:.88rem;word-break:break-all}
.up-row .fn small{display:block;color:var(--muted)}
.up-row .err{color:var(--pend);font-size:.85rem}
.notice{font-size:.85rem;color:var(--muted);margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:#F3EFFA;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.tip{position:fixed;pointer-events:none;background:var(--dark);color:#F3EFFA;font-size:.82rem;padding:7px 11px;border-radius:10px;opacity:0;z-index:20;max-width:240px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Daily de <em>bloqueos</em> CS</h1>
      <p class="sub" id="subtitle">Seguimiento de llamadas a partir del campo Comentario CS</p>
    </div>
    <div class="controls">
      <label for="dateSel">Día
        <select id="dateSel" aria-label="Día del informe"></select>
      </label>
      <button class="btn" id="uploadBtn" type="button">Cargar informes</button>
      <input type="file" id="fileIn" accept=".csv,text/csv" multiple hidden>
    </div>
  </header>

  <section id="upload" aria-live="polite">
    <h3>Informes por guardar</h3>
    <p class="hint" style="color:var(--muted);margin:0 0 6px;font-size:.88rem">Revisa a qué pestaña y día corresponde cada archivo antes de guardar. Si ya existe ese día, se reemplaza.</p>
    <div id="upRows"></div>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn" id="saveUp" type="button">Guardar</button>
      <button class="btn ghost" id="cancelUp" type="button">Cancelar</button>
    </div>
    <p class="notice" id="upNotice"></p>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="mem1" id="tab-mem1">Mem 1 <span class="n"></span></button>
    <button class="tab" role="tab" data-tab="mem2" id="tab-mem2">Base completa <span class="n"></span></button>
    <button class="tab" role="tab" data-tab="ringover" id="tab-ringover">Ringover <span class="n"></span></button>
  </nav>

  <main id="view"></main>
</div>
<div id="toast" role="status"></div>
<div class="tip" id="tip"></div>

<script>
(function(){
"use strict";
const BASES = {mem1:"Mem 1", mem2:"Base completa"};
const state = {
  snaps:{mem1:{},mem2:{}},   // base -> date -> snapshot
  tab:"mem1",
  date:{mem1:null,mem2:null},
  csFilter:null,
  blqFilter:null,
  showAll:false,
  pending:[],
  db:null, canWrite:true, loaded:false,
  hubspot:null,
  ringover:null, rvDate:null
};
function hsLink(id){ if(!state.hubspot||!id) return null; const h=state.hubspot; return `https://${h.domain}/contacts/${h.portal}/record/${h.object}/${id}`; }
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const SVGNS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs||{}) n.setAttribute(k, attrs[k]); return n; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2600); }
const tip = $("#tip");
function showTip(e, text){ tip.textContent=text; tip.style.opacity=1; const w=tip.offsetWidth, h=tip.offsetHeight; let x=e.clientX+12, y=e.clientY-h-10; if(x+w>innerWidth-8) x=e.clientX-w-12; if(y<8) y=e.clientY+14; tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.style.opacity=0; }
function bindTip(node, text){ node.addEventListener("mousemove", e=>showTip(e,text)); node.addEventListener("mouseleave", hideTip); }

/* ---------- Fechas ---------- */
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(iso, long){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-").map(Number);
  return long ? `${d} de ${["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][m-1]} ${y}` : `${d} ${MESES[m-1]}`;
}
function daysBetween(a,b){ return Math.round((Date.UTC(...b.split("-").map((v,i)=>i===1?v-1:+v)) - Date.UTC(...a.split("-").map((v,i)=>i===1?v-1:+v)))/86400000); }
const DATE_RX = /(?<!\d)(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:[\/.\-](\d{2,4}))?(?!\d)/;
// Fecha más reciente = la primera que aparece en el comentario
function lastCallDate(comment, reportISO){
  const m = DATE_RX.exec(comment || "");
  if(!m) return null;
  const d = +m[1], mo = +m[2];
  if(d<1||d>31||mo<1||mo>12) return null;
  const [ry, rm] = reportISO.split("-").map(Number);
  let y;
  if (m[3]) { y = +m[3]; if (y < 100) y += 2000; }
  else y = mo > rm ? ry - 1 : ry;
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function firstEntry(comment){
  const c = (comment||"").replace(/\s+/g," ").trim();
  // corta antes de la segunda fecha (la entrada anterior)
  const rx = new RegExp(DATE_RX.source, "g");
  rx.exec(c); const second = rx.exec(c);
  let s = second ? c.slice(0, second.index).trim() : c;
  if (s.length > 220) s = s.slice(0, 217).trim() + "…";
  return s;
}

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=ch;
    } else if(ch==='"') q=true;
    else if(ch===','){ row.push(f); f=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=ch;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return {head, rows: rows.filter(r=>r.some(c=>c.trim()!==""))};
}
function splitBloqueos(v){
  const parts = (v||"").split(";").map(s=>s.trim().replace(/\.$/,"")).filter(Boolean);
  return parts.length ? parts : ["Sin bloqueo indicado"];
}
function buildSnapshot(text, base, dateISO){
  const {head, rows} = parseCSV(text);
  const ix = n => head.findIndex(h => h.trim().toLowerCase() === n.toLowerCase());
  const need = {owner:"C.S. Owner", com:"Comentario CS", blq:"BLOQUEO: Detalle", proj:"Project name"};
  const I = {}; const missing=[];
  for (const k in need){ I[k]=ix(need[k]); if(I[k]<0) missing.push(need[k]); }
  if (missing.length) throw new Error("Faltan columnas: " + missing.join(", "));
  I.id = ix("ID de registro"); I.pr = ix("Tipo de Prioridad CS");
  const out = rows.map(r => {
    const com = r[I.com] || "";
    const u = lastCallDate(com, dateISO);
    return {
      id: I.id>=0 ? r[I.id] : "",
      p: (r[I.proj]||"").replace(/\s+/g," ").trim(),
      o: (r[I.owner]||"").trim() || "Sin asignar",
      b: splitBloqueos(r[I.blq]),
      pr: I.pr>=0 ? (r[I.pr]||"").trim() : "",
      u, h: u === dateISO,
      c: firstEntry(com)
    };
  });
  return {base, fecha: dateISO, total: out.length, cargado: new Date().toISOString(), rows: out};
}
function guessFromName(name){
  const n = name.toLowerCase();
  const base = /mem[\s_\-]?1/.test(n) ? "mem1" : "mem2";
  const m = n.match(/(20\d{2})-(\d{2})-(\d{2})/);
  const today = new Date(); const pad=v=>String(v).padStart(2,"0");
  const date = m ? `${m[1]}-${m[2]}-${m[3]}` : `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  return {base, date};
}

/* ---------- Métricas ---------- */
function metrics(snap){
  const byCS = new Map();
  const blqTotals = new Map();
  for (const r of snap.rows){
    if(!byCS.has(r.o)) byCS.set(r.o,{cs:r.o,total:0,hoy:0,pend:0,stale:0,blq:new Map()});
    const c = byCS.get(r.o);
    c.total++; const called = r.u === snap.fecha; if(called) c.hoy++; else c.pend++;
    var days = r.u ? daysBetween(r.u, snap.fecha) : 999;
    if(days > 3) c.stale++;
    for (const b of r.b){ c.blq.set(b,(c.blq.get(b)||0)+1); blqTotals.set(b,(blqTotals.get(b)||0)+1); }
  }
  const cs = [...byCS.values()];
  const total = snap.rows.length, hoy = cs.reduce((a,c)=>a+c.hoy,0);
  const stale = cs.reduce((a,c)=>a+c.stale,0);
  return {cs, total, hoy, pend: total-hoy, pctPend: total? (total-hoy)/total : 0,
          stale: stale, pctStale: total ? stale/total : 0,
          bloqueos: [...blqTotals.entries()].sort((a,b)=>b[1]-a[1])};
}
const pct = v => Math.round(v*100) + "%";

/* ---------- Render ---------- */
function datesFor(base){ return Object.keys(state.snaps[base]).sort(); }
function render(){
  // pestañas
  for (const b of Object.keys(BASES)){
    const t = $("#tab-"+b); t.setAttribute("aria-selected", String(state.tab===b));
    const d = state.date[b] || datesFor(b).slice(-1)[0];
    t.querySelector(".n").textContent = d && state.snaps[b][d] ? state.snaps[b][d].total : "";
  }
  const rvTab = $("#tab-ringover");
  if(rvTab){
    rvTab.setAttribute("aria-selected", String(state.tab==="ringover"));
    let rvN = "";
    if(state.ringover && state.rvDate){ rvN = (state.ringover.daily||[]).filter(x=>x.date===state.rvDate).reduce((a,x)=>a+(x.out_total||0),0); }
    rvTab.querySelector(".n").textContent = rvN || "";
  }
  if(state.tab==="ringover"){ renderRingover(); return; }
  // selector de día
  const dates = datesFor(state.tab);
  if (!state.date[state.tab] || !state.snaps[state.tab][state.date[state.tab]]) state.date[state.tab] = dates.slice(-1)[0] || null;
  const sel = $("#dateSel"); sel.textContent = "";
  if (!dates.length) sel.append(el("option",{text:"Sin informes"}));
  for (const d of [...dates].reverse()) { const o = el("option",{value:d,text:fmtDate(d,true)}); if(d===state.date[state.tab]) o.selected=true; sel.append(o); }
  sel.disabled = !dates.length;

  const view = $("#view"); view.textContent = "";
  const date = state.date[state.tab];
  if (!date){
    view.append(el("div",{class:"empty"},
      el("b",{text: state.loaded ? `Aún no hay informes de ${BASES[state.tab]}` : "Cargando informes guardados…"}),
      state.loaded ? `Pulsa "Cargar informes" y sube el export de HubSpot de ${BASES[state.tab]}. Cada día queda guardado para poder compararlo.` : ""));
    return;
  }
  const snap = state.snaps[state.tab][date];
  const M = metrics(snap);
  $("#subtitle").textContent = `${BASES[state.tab]}: informe del ${fmtDate(date,true)}. Llamado hoy = la última fecha del Comentario CS coincide con el día del informe.`;

  // Marcador + evolución
  const prevDate = dates[dates.indexOf(date)-1];
  let deltaTxt = "Primer día registrado en esta pestaña.";
  if (prevDate){
    const P = metrics(state.snaps[state.tab][prevDate]);
    const dt = M.total - P.total, dp = Math.round(M.pctPend*100) - Math.round(P.pctPend*100);
    const s = v => (v>0?"+":"") + v;

function drawTrend(box, dates, current){
  const W = Math.max(box.clientWidth || 600, 280), H = 210, padL=8, padB=26, padT=18;
  const data = dates.map(d=>{ const m = metrics(state.snaps[state.tab][d]); return {d, hoy:m.hoy, pend:m.pend, total:m.total}; });
  const max = Math.max(1, ...data.map(x=>x.total))*1.08;
  const slot = Math.min(70, (W-padL*2)/Math.max(data.length,1));
  const bw = Math.max(14, slot*0.62);
  const svgW = Math.max(W, slot*data.length+padL*2);
  const svg = sv("svg",{viewBox:"0 0 "+svgW+" "+H, width:"100%", role:"img", "aria-label":"Avance diario"});
  const y = function(v){ return padT + (H-padT-padB) * (1 - v/max); };
  // Line connecting totals
  if(data.length>1){
    var pts=data.map(function(x,i){ var cx=padL+slot*i+slot/2; return cx+","+y(x.total); }).join(" ");
    svg.append(sv("polyline",{points:pts,fill:"none",stroke:"var(--heat)","stroke-width":2.5,"stroke-linejoin":"round","stroke-linecap":"round",opacity:"0.7"}));
  }
  // Dots on line
  data.forEach(function(x,i){
    var cx=padL+slot*i+slot/2;
    svg.append(sv("circle",{cx:cx,cy:y(x.total),r:4,fill:"var(--heat)",opacity:x.d===current?"1":"0.5"}));
  });
  data.forEach(function(x,i){
    var cx = padL + slot*i + (slot-bw)/2;
    var g = sv("g",{class:"clickable", opacity: x.d===current?"1":"0.55"});
    var hOk = (H-padT-padB)*x.hoy/max, hP = (H-padT-padB)*x.pend/max;
    g.append(sv("rect",{x:cx,y:H-padB-hOk,width:bw,height:hOk,fill:"var(--ok)",rx:2}));
    g.append(sv("rect",{x:cx,y:H-padB-hOk-hP,width:bw,height:hP,fill:"var(--pend)",rx:2}));
    var t = sv("text",{x:cx+bw/2,y:y(x.total)-10,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"var(--heat)"}); t.textContent=x.total; g.append(t);
    var lbl = sv("text",{x:cx+bw/2,y:H-8,"text-anchor":"middle","font-size":11,fill:"var(--muted)","font-weight":x.d===current?"700":"400"}); lbl.textContent=fmtDate(x.d); g.append(lbl);
    // Delta vs previous day
    if(i>0){var diff=x.total-data[i-1].total; var dt=sv("text",{x:cx+bw/2,y:y(x.total)-22,"text-anchor":"middle","font-size":10,"font-weight":600,fill:diff<0?"var(--ok)":diff>0?"var(--pend)":"var(--muted)"}); dt.textContent=(diff>0?"+":"")+diff; g.append(dt);}
    g.append(sv("rect",{x:cx,y:padT,width:slot,height:H-padT-padB,fill:"transparent"}));
    g.addEventListener("click",function(){ state.date[state.tab]=x.d; render(); });
    bindTip(g, fmtDate(x.d,true)+": "+x.total+" total, "+x.hoy+" llamados, "+x.pend+" pendientes ("+pct(x.total? x.pend/x.total:0)+" sin llamar)");
    svg.append(g);
  });
  box.append(svg);
}

function hbars(box, rows, opts){
  const W = Math.max(box.clientWidth || 480, 280), rowH = 30, labelW = Math.min(170, W*0.38), rightW = opts.rightW || 40;
  const H = rows.length*rowH + 6;
  const svg = sv("svg",{viewBox:`0 0 ${W} ${H}`, width:"100%", role:"img","aria-label":opts.label});
  const max = Math.max(1, ...rows.map(r=>r.total));
  const avail = W - labelW - rightW - 10;
  rows.forEach((r,i)=>{
    const yy = i*rowH + 4;
    const g = sv("g",{class:"clickable"});
    const active = state.csFilter===r.cs;
    const name = sv("text",{x:0,y:yy+rowH/2+1,"dominant-baseline":"middle","font-size":13,"font-weight":active?700:500});
    name.textContent = r.cs.length>24 ? r.cs.slice(0,23)+"…" : r.cs; g.append(name);
    let x = labelW;
    for (const seg of opts.segs(r)){
      const w = avail*seg.v/max; if(w<=0) continue;
      g.append(sv("rect",{x, y:yy+5, width:w, height:rowH-12, fill:seg.c, rx:2})); x+=w;
    }
    const lab = sv("text",{x:x+6,y:yy+rowH/2+1,"dominant-baseline":"middle","font-size":12.5,"font-weight":600}); lab.textContent = opts.right(r); g.append(lab);
    g.append(sv("rect",{x:0,y:yy,width:W,height:rowH,fill:"transparent"}));
    g.addEventListener("click",()=>{ state.csFilter = state.csFilter===r.cs?null:r.cs; render(); });
    bindTip(g, opts.tip(r));
    svg.append(g);
  });
  box.append(svg);
}

$("#saveUp").addEventListener("click", async ()=>{

    try{
      const s = buildSnapshot(p.text, p.base, p.date);
      if (state.db) await state.db.collection("snapshots").doc(`${p.base}_${p.date}`).set(s);

  view.append(p4);
  drawRvHours(b4, day);

  const p5=el("div",{class:"panel full"}, el("h2",{text:"Clientes sin contacto hace +3 días"}), el("p",{class:"hint",text:"Números llamados por CS cuya última conversación efectiva es anterior a hace 3 días (o nunca). Ordenado del más antiguo."}));
  view.append(p5);
  drawRvStale(p5, R);
}
function drawRvTrend(box, dates, current){
  const W=Math.max(box.clientWidth||600,280), H=200, padL=8, padB=26, padT=18;
  const data = dates.map(function(d){ var dd=(state.ringover.daily||[]).filter(function(x){return x.date===d;}); return {d:d, total:dd.reduce(function(a,x){return a+(x.out_total||0);},0), ans:dd.reduce(function(a,x){return a+(x.out_answered||0);},0)}; });
  const max=Math.max(1,...data.map(function(x){return x.total;}));
  const slot=Math.min(70,(W-padL*2)/Math.max(data.length,1));
  const bw=Math.max(14,slot*0.62);
  const svgW=Math.max(W,slot*data.length+padL*2);
  const svg=sv("svg",{viewBox:"0 0 "+svgW+" "+H,width:"100%",role:"img","aria-label":"Actividad diaria"});
  const hgt=function(v){return (H-padT-padB)*v/max;};
  data.forEach(function(x,i){
    var cx=padL+slot*i+(slot-bw)/2;
    var g=sv("g",{class:"clickable",opacity:x.d===current?"1":"0.55"});
    g.append(sv("rect",{x:cx,y:H-padB-hgt(x.total),width:bw,height:hgt(x.total),fill:"var(--heat)",opacity:"0.28",rx:2}));
    g.append(sv("rect",{x:cx,y:H-padB-hgt(x.ans),width:bw,height:hgt(x.ans),fill:"var(--ok)",rx:2}));
    var t=sv("text",{x:cx+bw/2,y:H-padB-hgt(x.total)-5,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"var(--heat)"}); t.textContent=x.total; g.append(t);
    var l=sv("text",{x:cx+bw/2,y:H-8,"text-anchor":"middle","font-size":11,fill:"var(--muted)","font-weight":x.d===current?"700":"400"}); l.textContent=fmtDate(x.d); g.append(l);
    g.append(sv("rect",{x:cx,y:padT,width:slot,height:H-padT-padB,fill:"transparent"}));
    g.addEventListener("click",function(){ state.rvDate=x.d; render(); });
    bindTip(g, fmtDate(x.d,true)+": "+x.total+" salientes, "+x.ans+" contestadas ("+pct(x.total?x.ans/x.total:0)+")");
    svg.append(g);
  });
  box.append(svg);
}
function drawRvVolume(box, day){
  var rows = day.map(function(d){ return {cs:rvAgentName(d.agent_id), total:d.out_total}; }).filter(function(r){return r.total>0;});
  rows.sort(function(a,b){ return b.total-a.total||a.cs.localeCompare(b.cs); });
  if(!rows.length){ box.append(el("div",{class:"empty",style:"padding:20px"}, el("b",{text:"Sin salientes"}))); return; }
  hbars(box, rows, {label:"Llamadas salientes por CS", rightW:50,
    segs:function(r){return [{v:r.total,c:"var(--heat)"}];},
    right:function(r){return String(r.total);},
    tip:function(r){return r.cs+": "+r.total+" llamadas salientes";}});
}
function drawRvContact(box, day){
  var rows = day.map(function(d){ return {cs:rvAgentName(d.agent_id), total:d.out_total, ans:d.out_answered, noans:d.out_total-d.out_answered}; }).filter(function(r){return r.total>0;});
  rows.sort(function(a,b){ return (b.ans/b.total)-(a.ans/a.total)||b.total-a.total; });
  if(!rows.length){ box.append(el("div",{class:"empty",style:"padding:20px"}, el("b",{text:"Sin salientes"}), "Ningún CS registró llamadas salientes este día.")); return; }
  hbars(box, rows, {label:"Contactabilidad por CS", rightW:130,
    segs:function(r){return [{v:r.ans,c:"var(--ok)"},{v:r.noans,c:"var(--pend)"}];},
    right:function(r){return r.ans+"/"+r.total+" · "+pct(r.ans/r.total);},
    tip:function(r){return r.cs+": "+r.ans+" de "+r.total+" contestadas ("+pct(r.ans/r.total)+")";}});
}
function drawRvEffective(box, day){
  var rows = day.map(function(d){ return {cs:rvAgentName(d.agent_id), total:d.out_total, eff:d.out_effective, rest:d.out_total-d.out_effective}; }).filter(function(r){return r.total>0;});
  rows.sort(function(a,b){ return (b.eff/b.total)-(a.eff/a.total)||b.eff-a.eff; });
  if(!rows.length){ box.append(el("div",{class:"empty",style:"padding:20px"}, el("b",{text:"Sin datos"}))); return; }
  hbars(box, rows, {label:"Contacto efectivo por CS", rightW:140,
    segs:function(r){return [{v:r.eff,c:"var(--brand)"},{v:r.rest,c:"var(--bar)"}];},
    right:function(r){return r.eff+"/"+r.total+" · "+pct(r.eff/r.total);},
    tip:function(r){return r.cs+": "+r.eff+" efectivas de "+r.total+" ("+pct(r.eff/r.total)+")";}});
}
function drawRvInbound(box, date){
  var rows = (state.ringover.inbound||[]).filter(function(x){return x.date===date;});
  if(!rows.length){ box.append(el("div",{class:"empty",style:"padding:20px"}, el("b",{text:"Sin entrantes"}))); return; }
  rows.sort(function(a,b){return b.in_total-a.in_total;});
  var t=el("table",{class:"list"});
  t.append(el("thead",null, el("tr",null, el("th",{text:"Grupo"}),el("th",{text:"Entrantes"}),el("th",{text:"Atendidas"}),el("th",{text:"Rechazadas"}),el("th",{text:"Sin devolver 24h"}))));
  var tb=el("tbody");
  rows.forEach(function(r){
    tb.append(el("tr",null,
      el("td",{class:"p",text:r.group}),
      el("td",{text:r.in_total}),
      el("td",null, el("span",{class:"tag ok",text:r.in_answered})),
      el("td",null, el("span",{class:"tag "+(r.in_missed?"pend":"ok"),text:r.in_missed})),
      el("td",null, el("span",{class:"tag "+(r.missed_not_returned?"danger":"ok"),text:r.missed_not_returned}))));
  });
  t.append(tb); box.append(t);
}
function drawRvHours(box, day){
  var byHour={};
  day.forEach(function(d){ var bh=d.by_hour||{}; for(var h in bh){ if(!byHour[h]) byHour[h]={total:0,ans:0}; byHour[h].total+=bh[h].total||0; byHour[h].ans+=bh[h].answered||0; } });
  var hours=Object.keys(byHour).map(Number);
  if(!hours.length){ box.append(el("div",{class:"empty",style:"padding:20px"}, el("b",{text:"Sin actividad"}))); return; }
  var minH=Math.min.apply(null,hours), maxH=Math.max.apply(null,hours), allHours=[];
  for(var hh=minH; hh<=maxH; hh++) allHours.push(hh);
  var W=Math.max(box.clientWidth||480,280), H=180, padB=24, padT=16, padL=6;
  var max=Math.max(1,...allHours.map(function(h){return (byHour[h]||{total:0}).total;}));
  var slot=(W-padL*2)/allHours.length, bw=Math.max(8,slot*0.7);
  var svg=sv("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":"Actividad por hora"});
  var barh=function(v){return (H-padT-padB)*v/max;};
  allHours.forEach(function(h,i){
    var o=byHour[h]||{total:0,ans:0}, cx=padL+slot*i+(slot-bw)/2, g=sv("g",{class:"clickable"});
    g.append(sv("rect",{x:cx,y:H-padB-barh(o.total),width:bw,height:barh(o.total),fill:"var(--heat)",opacity:"0.28",rx:2}));
    g.append(sv("rect",{x:cx,y:H-padB-barh(o.ans),width:bw,height:barh(o.ans),fill:"var(--ok)",rx:2}));
    if(allHours.length<=14 || h%2===0){ var l=sv("text",{x:cx+bw/2,y:H-8,"text-anchor":"middle","font-size":10,fill:"var(--muted)"}); l.textContent=h+"h"; g.append(l); }
    g.append(sv("rect",{x:cx,y:padT,width:slot,height:H-padT-padB,fill:"transparent"}));
    bindTip(g, h+":00 — "+o.total+" salientes, "+o.ans+" contestadas");
    svg.append(g);
  });
  box.append(svg);
}
function drawRvStale(p, R){
  var rows = R.stale_clients||[];
  if(!rows.length){ p.append(el("div",{class:"empty",style:"padding:22px"}, el("b",{text:"Sin clientes rezagados"}), "Todos los clientes llamados tienen contacto efectivo reciente.")); return; }
  var t=el("table",{class:"list"});
  t.append(el("thead",null, el("tr",null, el("th",{text:"Número"}),el("th",{text:"CS"}),el("th",{text:"Último contacto"}),el("th",{text:"Intentos desde"}),el("th",{text:"Último estado"}))));
  var tb=el("tbody");
  rows.forEach(function(r){
    tb.append(el("tr",null,
      el("td",{class:"p",text:r.number}),
      el("td",{text:rvAgentName(r.agent_id)}),
      el("td",{text: r.last_contact? fmtDate(r.last_contact,true):"Sin contacto efectivo"}),
      el("td",null, el("span",{class:"days",text:r.attempts_since})),
      el("td",null, el("span",{class:"tag pend",text:r.last_state||"—"}))));
  });
  t.append(tb); p.append(el("div",{class:"scroll"},t));
}

/* ---------- Navegación ---------- */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ state.tab=t.dataset.tab; state.csFilter=null; state.blqFilter=null; location.hash=state.tab; render(); }));
$("#dateSel").addEventListener("change",e=>{ if(state.tab==="ringover") state.rvDate=e.target.value; else state.date[state.tab]=e.target.value; render(); });
function fromHash(){ const h=location.hash.slice(1); if(BASES[h]||h==="ringover"){ state.tab=h; state.csFilter=null; render(); } }
addEventListener("hashchange", fromHash);
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(render,150); });
{ const h=location.hash.slice(1); if(BASES[h]||h==="ringover") state.tab=h; }
render();

/* ---------- Almacenamiento ---------- */
(async ()=>{
  let db=null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(_){ db=null; }
  state.db = db;
  // Ringover siempre desde JSON estático (generado por Windmill -> GitHub)
  fetch("ringover.json").then(r=>r.ok?r.json():null).then(j=>{
    if(j){ state.ringover=j; const ds=[...new Set((j.daily||[]).map(x=>x.date))].sort(); if(!state.rvDate) state.rvDate=ds.slice(-1)[0]||null; render(); }
  }).catch(()=>{});
  if (!db){
    try {
      const r = await fetch("data.json");
      if (r.ok) {
        const j = await r.json();
        if(j.hubspot) state.hubspot = j.hubspot;
        const next = {mem1:{},mem2:{}};
        for (const [k,v] of Object.entries(j.snapshots||{})){
          if(v && next[v.base]) next[v.base][v.fecha]=v;
        }
        state.snaps = next;
      }
    } catch(_){}
    state.loaded=true; state.canWrite=false; render();
    const btn=$("#uploadBtn"); if(btn) btn.hidden=true;
    return;
  }
  try{
    const u = window.claude.use ? await window.claude.use("user") : null;
    if (u && u.can){ const c = await u.can("data.write"); if (c===false) state.canWrite=false; }
  }catch(_){}
  if(!state.canWrite) $("#uploadBtn").hidden = true;
  db.collection("snapshots").onSnapshot(snap=>{
    const next = {mem1:{},mem2:{}};
    for (const d of snap.docs){ const v=d.data(); if(v && next[v.base]) next[v.base][v.fecha]=v; }
    state.snaps = next; state.loaded = true; render();
  }, err=>{ state.loaded=true; render(); toast("No se pudieron leer los informes guardados"); });
})();
})();
</script>
